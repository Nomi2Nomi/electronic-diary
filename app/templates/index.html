<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Электронный дневник</title></head>
<body>
  <h1>Электронный дневник</h1>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="post" action="/grades">
    <input name="student" placeholder="Студент" required>
    <input name="subject" placeholder="Предмет" required>
    <input name="grade" type="number" min="1" max="5" placeholder="Оценка" required>
    <button>Добавить</button>
  </form>
  <table border="1" cellpadding="6">
    <tr><th>Студент</th><th>Средний балл</th></tr>
    {% for name, avg in rows %}<tr><td>{{ name }}</td><td>{{ avg }}</td></tr>{% endfor %}
  </table>
</body>
</html>
